name: Frontend deployment paused (Cloudflare owns deployment)

# Frontend deployment is intentionally not performed by GitHub Actions.
# Cloudflare Workers Builds is the single deployment owner so builds and
# releases are visible in the Cloudflare Deployments page. See
# docs/DEPLOYMENT.md for the dashboard configuration.
#
# workflow_dispatch keeps this notice visible in GitHub Actions without
# creating a second automatic deployment pipeline.
on:
  workflow_dispatch:

jobs:
  deployment-paused:
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment ownership
        run: |
          echo "Frontend deployment from GitHub Actions is paused."
          echo "Cloudflare Workers Builds deploys this repository."
